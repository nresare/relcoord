[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "relcoord"
version = "0.1.1"
description = "Image version service for relcoord."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "boto3",
  "click",
  "dulwich",
  "httpx",
  "hypercorn",
  "manifest-builder>=0.7.3",
  "pyjwt[crypto]",
  "pyyaml",
  "starlette",
  "surrealdb",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "ty",
  "ruff",
  "bktools",
  "httpx2>=2.4.0",
]


[[tool.uv.index]]
name = "reposnake"
url = "https://repo.noa.re/"

[[tool.uv.index]]
name = "upstream"
url = "https://pypi.org/simple"

# manifest-builder is released to PyPI, but reposnake still carries older
# versions of it. Naming the index here keeps first-index-match in force for
# every other dependency, rather than letting the whole resolution fall back to
# whichever index happens to hold the newest version.
[tool.uv.sources]
manifest-builder = { index = "upstream" }

[project.scripts]
relcoord = "relcoord.main:main"
relcoord-eks-kubeconfig = "relcoord.eks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relcoord"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
